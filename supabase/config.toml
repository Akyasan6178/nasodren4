# NS4-18: yalnızca bu depoda kullanılan Supabase ayarları.
# project_id yalnızca yerel bir addır (Supabase CLI için); uzak proje `supabase link --project-ref` ile bağlanır.
# Buraya gerçek proje ref'i, URL, anahtar veya secret yazılmaz.
project_id = "ferah-nefes"

[functions.submit-score]
# Tarayıcı Supabase Auth kullanmaz (hesap yok). Function kendi doğrulamasını yapar (yöntem, origin,
# içerik türü, boyut, alanlar, makullük, hız sınırı, tekrar). Publishable (sb_publishable_…) anahtarlar JWT
# olmadığından JWT doğrulaması kapalıdır.
verify_jwt = false
